<!DOCTYPE html>
<html>
<head>
  <title>Airplane Recognizer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@1.0.0"></script>
</head>
<body>
  <h1>Airplane Recognizer</h1>
  <input type="file" id="imageInput" accept="image/*">
  <div id="result"></div>

  <script>
    async function loadModel() {
      const model = await tf.loadLayersModel('models/aircraft_model/model.json');
      return model;
    }

    async function predictImage(imageUrl) {
      const model = await loadModel();
      const image = await tf.io.loadImage(imageUrl);
      const resized = tf.image.resizeBilinear(image, [224, 224]);
      const batched = tf.expandDims(resized, 0);
      const normalized = batched.div(255.0);
      
      const predictions = await model.predict(normalized);
      const result = await predictions.array();
      
      // Process predictions and display results
      document.getElementById('result').innerText = `Recognized aircraft: ${result[0].argMax()}`;
    }

    document.getElementById('imageInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      const imageUrl = URL.createObjectURL(file);
      await predictImage(imageUrl);
    });
  </script>
</body>
</html>
