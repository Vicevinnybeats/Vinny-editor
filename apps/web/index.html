<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <!-- iOS ignores the web manifest's display mode entirely and relies on
         these instead to actually hide the Safari chrome when added to the
         home screen - without them it opens as a normal browser tab even
         though the manifest says "standalone". -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vinny" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Vinny Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
